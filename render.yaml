# Render 一键部署配置（免费 Web 服务）
# 在 Render 控制台「New + → Web Service」，连接本仓库即可自动识别此文件
services:
  - type: web
    name: swimtrack
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
