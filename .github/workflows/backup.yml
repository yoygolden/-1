name: Daily D1 backup

# 每日把线上 SwimTrack 的 D1 整库导出为 SQL，提交到仓库 backups/store.sql，作为异地兜底。
# D1 本身已是多副本冗余，此备份用于极端情况下的灾难恢复与历史追溯。
on:
  schedule:
    - cron: '23 16 * * *'   # 每天 UTC 16:23（避开整点）
  workflow_dispatch: {}      # 允许手动触发

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Export D1 to SQL
        run: |
          mkdir -p backups
          wrangler d1 export swimtrack --remote --output=backups/store.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Commit backup
        run: |
          git config user.name "swimtrack-bot"
          git config user.email "bot@swimtrack.local"
          git add backups/store.sql
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "chore: daily D1 backup $(date -u +%F)"
            git push
          fi
