name = "swimtrack"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 前端静态资源由 Cloudflare 直接托管；SPA 回退到 index.html
assets = { directory = "./", binding = "ASSETS", html_handling = "single-page-application", not_found_handling = "single-page-application" }

# 每日 04:00 (UTC) 把数据快照写入 R2 做异地备份（保证数据不丢失）
[triggers]
crons = ["0 4 * * *"]

# Cloudflare D1 绑定（d1store.js 同时用下方 ${ENV} 变量走 REST，二者取其一即可；这里保留绑定以备扩展）
[[d1_databases]]
binding = "DB"
database_name = "swimtrack-db"
database_id = "${D1_DATABASE_ID}"

# R2 备份桶（定时任务写入快照）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "swimtrack-media"

# 运行时环境变量：从部署时注入的环境变量取值（CI 中由 GitHub Secrets 提供）
#   D1_ACCOUNT_ID / D1_DATABASE_ID / CF_API_TOKEN 供 d1store.js 直连 D1 REST
[vars]
D1_ACCOUNT_ID = "${D1_ACCOUNT_ID}"
D1_DATABASE_ID = "${D1_DATABASE_ID}"
CF_API_TOKEN = "${CF_API_TOKEN}"
